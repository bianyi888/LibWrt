name: Build LibWrt RE-SS-01 WiFi-No

on:
  workflow_dispatch:

env:
  CONFIG_FILE: config/re-ss-01.config
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: 25.12-nss

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell \
          /usr/local/share/swift /usr/local/share/edge_driver /opt/hostedtoolcache \
          /usr/local/lib/node_modules /usr/local/go /home/linuxbrew
        sudo docker image prune --all --force 2>/dev/null || true
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
          git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
          libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz \
          genisoimage msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip libpython3-dev qemu-utils \
          rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean

    - name: 加 lucky 源
      run: |
        if ! grep -q "luci-app-lucky" feeds.conf.default; then
          echo 'src-git lucky https://github.com/gdy666/luci-app-lucky.git' >> feeds.conf.default
        fi
        cat feeds.conf.default

    - name: 更新 feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: LAN IP 改成 192.168.5.1
      run: |
        sed -i 's/192\.168\.1\.1/192.168.5.1/g' package/base-files/files/bin/config_generate

    - name: 加载配置
      run: |
        cp $CONFIG_FILE .config
        make defconfig

    - name: 下载依赖
      run: |
        make download -j$(nproc)
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译固件
      run: |
        echo -e "$(nproc) thread compile"
        make -j$(nproc) V=s || make -j1 V=s

    - name: 整理固件
      id: organize
      run: |
        cd bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "DATE=$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: 发布 Release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: RE-SS-01-WIFINO-${{ env.DATE }}
        files: ${{ env.FIRMWARE }}/*
        body: |
          LibWrt 25.12-nss JDCloud RE-SS-01 (Arthur) WiFi-No + lucky
          LAN IP: 192.168.5.1
